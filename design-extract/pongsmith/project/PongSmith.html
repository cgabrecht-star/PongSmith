<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PongSmith — Die Tischtennis-Schmiede</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --bg-0: #0e0e0e;
    --bg-1: #161513;
    --bg-2: #1c1b18;
    --bg-3: #232220;
    --bg-4: #2a2826;
    --line: #34302a;
    --line-2: #2a2723;
    --ink-0: #fafaf7;
    --ink-1: #e8e5dc;
    --ink-2: #b5afa1;
    --ink-3: #8a8478;
    --ink-4: #5e5a52;
    --ember: #ff6b35;
    --ember-2: #f4a261;
    --ember-deep: #c84a1e;
    --ember-glow: rgba(255,107,53,.35);
    --good: #6ec275;
    --warn: #e0b54a;
    --bad: #d96a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-0); color: var(--ink-0); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  #root { min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  .ff-display { font-family: 'Bebas Neue', 'Inter', sans-serif; letter-spacing: 0.01em; }
  .ff-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* Forge texture — subtle scanlines + grain */
  .forge-bg {
    background-color: var(--bg-1);
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(255,107,53,0.06), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(255,107,53,0.04), transparent 50%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);
  }
  .anvil-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
  }
  .anvil-divider-strong {
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--line) 20%, var(--ember) 50%, var(--line) 80%, transparent 100%);
    opacity: 0.6;
  }

  /* Ember CTA */
  .ember-btn {
    position: relative;
    background: linear-gradient(180deg, #ff7a45 0%, var(--ember) 50%, var(--ember-deep) 100%);
    color: #1a0d05;
    border: 1px solid #ff8b56;
    border-bottom-color: #a83a16;
    border-radius: 4px;
    padding: 14px 22px;
    font-weight: 700;
    letter-spacing: 0.02em;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.35),
      inset 0 -1px 0 rgba(0,0,0,0.25),
      0 0 0 0 rgba(255,107,53,0),
      0 1px 0 rgba(0,0,0,0.4);
    transition: box-shadow 220ms ease, transform 120ms ease;
  }
  .ember-btn:hover {
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -1px 0 rgba(0,0,0,0.25),
      0 0 30px 4px rgba(255,107,53,0.45),
      0 1px 0 rgba(0,0,0,0.4);
  }
  .ember-btn:active { transform: translateY(1px); }
  .ember-btn-glow {
    position: relative;
  }
  .ember-btn-glow::after {
    content: '';
    position: absolute;
    inset: -8px;
    background: radial-gradient(ellipse at center bottom, rgba(255,107,53,0.55), transparent 65%);
    filter: blur(10px);
    z-index: -1;
    pointer-events: none;
    animation: emberPulse 2.6s ease-in-out infinite;
  }
  @keyframes emberPulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.95; }
  }

  /* Spark particle ascending */
  @keyframes sparkRise {
    0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-180px) translateX(var(--sx,8px)) scale(0.3); opacity: 0; }
  }
  .spark {
    position: absolute;
    width: 3px; height: 3px;
    background: var(--ember-2);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--ember), 0 0 12px var(--ember-glow);
    animation: sparkRise var(--dur,3s) linear infinite;
    animation-delay: var(--del,0s);
  }

  /* Hammer strike */
  @keyframes hammerStrike {
    0%, 60% { transform: rotate(-8deg); }
    70% { transform: rotate(35deg); }
    78% { transform: rotate(28deg); }
    100% { transform: rotate(-8deg); }
  }

  /* Typing dots */
  @keyframes typingBlink {
    0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }
  .typing-dot { animation: typingBlink 1.2s infinite; }

  /* Blink caret */
  @keyframes caretBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  .caret { animation: caretBlink 1s steps(1) infinite; }

  /* Card surface */
  .card-forged {
    background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.025), 0 8px 24px rgba(0,0,0,0.3);
  }
  .card-forged-2 {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  /* Tag / pill */
  .tag-line {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 2px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-2);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }
  .tag-ember {
    border-color: rgba(255,107,53,0.35);
    color: var(--ember-2);
    background: rgba(255,107,53,0.06);
  }

  /* Bar visualization */
  .stat-track {
    height: 4px;
    background: var(--bg-4);
    border-radius: 1px;
    overflow: hidden;
    position: relative;
  }
  .stat-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ember-deep), var(--ember));
    border-radius: 1px;
    transition: width 600ms cubic-bezier(.2,.8,.2,1);
  }

  /* Screen transitions */
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .screen-anim { animation: screenIn 280ms cubic-bezier(.2,.8,.2,1) both; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-0); }
  ::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 4px; border: 2px solid var(--bg-0); }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

  /* Header sticky */
  .glass-bar {
    background: rgba(14,14,14,0.78);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid var(--line-2);
  }

  /* Hero hammer banner */
  .anvil-stripe {
    background-image: repeating-linear-gradient(45deg,
      transparent 0 8px,
      rgba(255,107,53,0.12) 8px 9px);
  }

  /* Forge corner cut */
  .corner-cut {
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }

  /* Number ring */
  .ring-svg circle { transition: stroke-dashoffset 700ms cubic-bezier(.2,.8,.2,1); }

  /* Link reset */
  a { color: inherit; text-decoration: none; }

  /* Focus rings */
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 1px solid var(--ember);
    outline-offset: 2px;
  }

  /* Mobile-safe widths */
  .max-shell { max-width: 1240px; margin-inline: auto; }

  /* Tab bar bottom mobile */
  @media (max-width: 720px) {
    .hide-mobile { display: none !important; }
  }
  @media (min-width: 721px) {
    .show-mobile { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="lib.jsx"></script>
<script type="text/babel" src="screens-landing.jsx"></script>
<script type="text/babel" src="screens-chat.jsx"></script>
<script type="text/babel" src="screens-recommend.jsx"></script>
<script type="text/babel" src="screens-detail.jsx"></script>
<script type="text/babel" src="screens-ratgeber.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
